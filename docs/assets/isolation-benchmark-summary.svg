<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Isolation benchmark summary</title>
  <desc id="desc">Isolated agents achieved 100 percent correctness, zero percent contamination, and 0.038 US dollars total model cost over five runs. Shared sessions achieved 60 percent correctness, 40 percent contamination, and 1.002 US dollars cost.</desc>
  <rect width="1000" height="520" rx="24" fill="#f8fafc"/>
  <text x="50" y="58" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Isolation vs shared session — 5 paired runs</text>
  <text x="50" y="88" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" fill="#475569">DeepSeek V4 Pro · thinking high · Pi 0.87.1 · lower contamination and cost are better</text>

  <text x="50" y="145" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Correct results</text>
  <text x="230" y="177" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#334155">Isolated</text>
  <rect x="320" y="158" width="560" height="26" rx="6" fill="#dbeafe"/>
  <rect x="320" y="158" width="560" height="26" rx="6" fill="#2563eb"/>
  <text x="895" y="178" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">100%</text>
  <text x="230" y="217" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#334155">Shared</text>
  <rect x="320" y="198" width="560" height="26" rx="6" fill="#e2e8f0"/>
  <rect x="320" y="198" width="336" height="26" rx="6" fill="#64748b"/>
  <text x="895" y="218" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#334155">60%</text>

  <text x="50" y="279" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Contaminated outputs</text>
  <text x="230" y="311" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#334155">Isolated</text>
  <rect x="320" y="292" width="560" height="26" rx="6" fill="#dcfce7"/>
  <circle cx="326" cy="305" r="6" fill="#16a34a"/>
  <text x="895" y="312" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#166534">0%</text>
  <text x="230" y="351" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#334155">Shared</text>
  <rect x="320" y="332" width="560" height="26" rx="6" fill="#fee2e2"/>
  <rect x="320" y="332" width="224" height="26" rx="6" fill="#dc2626"/>
  <text x="895" y="352" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#991b1b">40%</text>

  <text x="50" y="413" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Provider-reported cost for 5 runs</text>
  <text x="230" y="445" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#334155">Isolated</text>
